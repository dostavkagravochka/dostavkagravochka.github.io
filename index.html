<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформлення доставки</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #727272; font-weight: 500; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { text-align: center; margin-top: 15px; font-weight: bold; }
        /* Стили для Select2 */
        .select2-container .select2-selection--single { height: 45px; border: 1px solid #ddd; border-radius: 8px; }
        .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: 45px; padding-left: 12px; }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 45px; }
        .order-id-display { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 20px; }
        /* Ник вверху (клик = копирование) */
        .nick-wrap { text-align: center; margin-bottom: 8px; }
        #nickBtn { display: none; cursor: pointer; font-size: 12px; font-weight: bold; background: #eef6ff; padding: 3px 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nick-wrap">
        <span id="nickBtn" title="Натисни, щоб скопіювати"></span>
    </div>

    <h2>🚚 Дані отримувача посилики</h2>
    <div class="order-id-display" id="orderIdDisplay">Завантаження...</div>

    <form id="deliveryForm">
        <div class="form-group">
            <label>Прізвище Ім'я По батькові</label>
            <input type="text" id="fio" placeholder="ПІБ" required>
        </div>

        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" id="phone" placeholder="0501234567" required>
        </div>

        <div class="form-group">
            <label>Місто (почніть вводити)</label>
            <select id="citySelect" style="width: 100%;" required>
                <option value="">Оберіть місто...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Відділення Нової Пошти</label>
            <select id="branchSelect" style="width: 100%;" disabled required>
                <option value="">Спочатку оберіть місто</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">Підтвердити дані</button>
    </form>
    <div id="statusMessage" class="status"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
    // --- НАСТРОЙКИ ---
    const WORKER_URL = 'https://dostavkagravochka.brelok2023.workers.dev';

    // --- ЛОГИКА ---
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    let selectedCityRef = '';
    let selectedBranchRef = '';

    $(document).ready(function() {
        // Проверка наличия ID заказа в ссылке
        if (!orderId) {
            document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px;">❌ Помилка: Невірне посилання (немає ID замовлення).</h2>';
            return;
        }
        $('#orderIdDisplay').text(`Замовлення №: ${orderId}`);

        // НИК ВВЕРХУ (клик = копирование)
        const nick = urlParams.get('nick');
        if (nick) {
            const nickBtn = $('#nickBtn');
            nickBtn.text(nick).show();
            nickBtn.on('click', function () {
                const done = () => {
                    nickBtn.text('✅ Скопійовано');
                    setTimeout(() => nickBtn.text(nick), 1200);
                };
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(nick).then(done);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = nick;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    done();
                }
            });
        }

        // 1. ПОИСК ГОРОДА (Через Worker)
        $('#citySelect').select2({
            placeholder: "Введіть назву міста...",
            minimumInputLength: 2,
            language: { inputTooShort: () => "Введіть хоча б 2 літери для пошуку..." },
            ajax: {
                url: WORKER_URL,
                type: 'POST',
                dataType: 'json',
                delay: 500,
                contentType: 'application/json',
                data: function (params) {
                    return JSON.stringify({
                        action: 'search_city',
                        term: params.term
                    });
                },
                processResults: function (data) {
                    if (data.status === 'success' && data.data) {
                        return { results: data.data };
                    }
                    return { results: [] };
                }
            }
        });

        // 2. ВЫБОР ОТДЕЛЕНИЯ (Через Worker)
        $('#citySelect').on('select2:select', function (e) {
            selectedCityRef = e.params.data.id;
            $('#branchSelect').prop('disabled', true).empty().append('<option>Завантаження...</option>');

            fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'get_branches',
                    city_ref: selectedCityRef
                })
            })
            .then(res => res.json())
            .then(response => {
                $('#branchSelect').empty().append('<option value="">Оберіть відділення...</option>');
                if (response.status === 'success') {
                    response.data.forEach(branch => {
                        $('#branchSelect').append(`<option value="${branch.id}">${branch.text}</option>`);
                    });
                    $('#branchSelect').prop('disabled', false).select2();
                } else {
                    alert('Не вдалося завантажити відділення. Спробуйте ще раз.');
                }
            })
            .catch(err => {
                console.error(err);
                $('#branchSelect').empty().append('<option value="">Помилка завантаження</option>');
            });
        });

        // Сохранение Ref отделения при выборе
        $('#branchSelect').on('change', function() {
            selectedBranchRef = $(this).val();
        });

        // 3. ОТПРАВКА ДАННЫХ (Через Worker в Google Таблицу)
        $('#deliveryForm').on('submit', async function(e) {
            e.preventDefault();
            const btn = $('#submitBtn');
            const status = $('#statusMessage');

            btn.prop('disabled', true).text('Збереження...');
            status.text('');

            const payload = {
                action: 'update_delivery',
                order_id: orderId,
                fio: $('#fio').val().trim(),
                phone: $('#phone').val().trim(),
                city: $('#citySelect option:selected').text(),
                branch: $('#branchSelect option:selected').text(),
                ref_data: {
                    city_ref: selectedCityRef,
                    branch_ref: selectedBranchRef
                }
            };

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    document.body.innerHTML = `
                        <div class="container" style="text-align:center;">
                            <h1 style="color:green; font-size: 50px;">✅</h1>
                            <h2>Дякуємо!</h2>
                            <p>Дані успішно збережені.</p>
                            <p>Ми вже готуємо ваше замовлення.</p>
                        </div>
                    `;
                } else {
                    status.css('color', 'red').text('Помилка: ' + result.message);
                    btn.prop('disabled', false).text('Спробувати ще раз');
                }
            } catch (error) {
                status.css('color', 'red').text('Помилка з\'єднання.');
                btn.prop('disabled', false).text('Спробувати ще раз');
            }
        });
    });
</script>

</body>
</html>
